# Deploy the CodeFuse-Query VitePress documentation to GitHub Pages.
#
# Triggers:
#   - push to `main` that changes anything under `docs/`
#   - manual run from the Actions tab
#
# The built site is published with the official GitHub Pages actions
# (actions/configure-pages + actions/upload-pages-artifact + actions/deploy-pages).
# It therefore requires the repository's Pages source to be set to "GitHub Actions".
# See: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".

name: Deploy VitePress docs to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-mdbook.yml"
  workflow_dispatch:

# Grant the GITHUB_TOKEN the permissions required to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, cancelling any in-progress run.
# A distinct group name avoids colliding with the existing `pages` workflow.
concurrency:
  group: "docs-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --prefix docs

      - name: Build VitePress site
        run: npm run docs:build --prefix docs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
